name: Check Modrinth Updates
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
concurrency:
  group: modrinth-check
  cancel-in-progress: false
jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Run script
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          COLLECTION_ID: QLg88A8c
          # LOADERS: paper
          # GAME_VERSIONS: "26.3"
        run: python script.py
      - name: Save cache
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update versions cache [skip ci]"
          file_pattern: 'last_versions.json'
